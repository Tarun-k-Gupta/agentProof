[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false

# Gate G-quality: the invariant campaign the README cites.
[profile.deep.invariant]
runs = 10000
depth = 50
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
