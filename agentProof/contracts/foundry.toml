[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Required by the pinned ERC-7579 reference account and by EntryPoint v0.8,
# whose reentrancy guard is transient storage. On a pre-Cancun EVM the guard
# misfires and every handleOps reverts with Reentrancy().
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 50
fail_on_revert = false

# Gate G-quality: the invariant campaign the README cites.
[profile.deep.invariant]
runs = 10000
depth = 50
fail_on_revert = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

# Pinned Solidity dependencies (installed with `forge install`, contracts/lib is
# gitignored — CI reinstalls them). Recorded here because two of these versions
# are load-bearing and were arrived at the hard way:
#
#   erc7579-implementation  v0.3.1  the reference account we install the hook on
#   account-abstraction     v0.8.0  v0.7 predates ISenderCreator, which the
#                                   reference's EntryPoint test helper needs;
#                                   v0.9 gates handleOps behind
#                                   `tx.origin == msg.sender && no code`, so a
#                                   test contract cannot call it at all.
