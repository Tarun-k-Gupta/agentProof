name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Key hygiene is part of the pitch, so it is enforced rather than asked
      # for. The agent process gets a scoped session key and nothing else; if a
      # judge greps the repo and finds the agent holding the owner key, the
      # whole thesis dies.
      - name: The agent must never read the owner key
        run: |
          if grep -rn "OWNER_PRIVATE_KEY" apps/agents/ 2>/dev/null; then
            echo "::error::apps/agents must never reference OWNER_PRIVATE_KEY"
            exit 1
          fi
          echo "ok: agent process does not reference the owner key"

      - name: No secrets committed
        run: |
          if grep -rEn "(0x[a-fA-F0-9]{64})" --include="*.ts" --include="*.json" \
               --exclude-dir=node_modules --exclude="*.test.ts" . | grep -v "0x0000" ; then
            echo "::error::possible private key committed"
            exit 1
          fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1

      # contracts/lib is gitignored and there is no submodule, so the checkout
      # arrives without forge-std and every `forge` command below fails on a
      # missing import rather than on anything about this repo.
      # contracts/lib is gitignored and there is no submodule, so the checkout
      # arrives without any Solidity dependency. Versions are pinned: see the
      # note at the bottom of contracts/foundry.toml for why these two in
      # particular cannot drift.
      - name: Install pinned Solidity dependencies
        run: |
          forge install foundry-rs/forge-std --no-git --root contracts
          forge install erc7579/erc7579-implementation --no-git --root contracts
          forge install eth-infinitism/account-abstraction@v0.8.0 --no-git --root contracts
          forge install vectorized/solady --no-git --root contracts
          forge install rhinestonewtf/sentinellist --no-git --root contracts
          forge install OpenZeppelin/openzeppelin-contracts --no-git --root contracts

      - run: forge fmt --check --root contracts
      - run: forge build --root contracts
      - run: forge test --root contracts -vvv

      # Gate G1 (PRD 15): the hook installed on the reference ERC-7579 account,
      # driven through a real EntryPoint. Called out separately from the unit
      # suite because it is the one result the whole project rests on.
      - name: Gate G1 - the account rejects a UserOp that bypasses the SDK
        run: forge test --root contracts --match-path 'test/integration/*' -vv
      - name: Invariant campaign
        run: FOUNDRY_PROFILE=deep forge test --root contracts --match-path 'test/invariant/*' -vv
