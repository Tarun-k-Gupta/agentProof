name: Formal verification

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  smtchecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # solc dlopens libz3 by exact soname — 0.8.28 asks for libz3.so.4.12 and
      # will not accept 4.13 or 4.16. A mismatched z3 is not an error: solc
      # emits a warning, skips CHC analysis entirely, and produces a log with no
      # assertion violations in it. Pin the version.
      - name: Install solc and a matching z3
        run: |
          pip install solc-select
          pip install --target "$RUNNER_TEMP/z3" 'z3-solver==4.12.2.0'
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/z3/z3/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          solc-select install 0.8.28
          solc-select use 0.8.28

      - name: Run SMTChecker
        env:
          LC_ALL: C
        run: bash scripts/run-formal-verification.sh

      # Two failure modes are guarded here, not one:
      #   1. the real properties stop verifying
      #   2. the broken control starts verifying, meaning the checker is inert
      # The second is the one that quietly turns a proof into decoration.
      - name: MAX_TRANSFER must not regress
        run: |
          status=$(node -p "require('./proofs/MAX_TRANSFER.json').status")
          echo "MAX_TRANSFER: $status"
          [ "$status" = "PROVEN" ] || { echo "::error::MAX_TRANSFER regressed to $status"; exit 1; }

      - name: The broken control must still produce a counterexample
        run: |
          node -e "
            const s = require('./proofs/summary.json');
            if (!s.negativeControl.counterexampleProduced) {
              console.error('The deliberately broken spec verified cleanly — the checker is not running.');
              process.exit(1);
            }
            console.log('negative control OK');
          "

      - uses: actions/upload-artifact@v4
        with:
          name: proofs
          path: |
            proofs/
            artifacts/smt/
